<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .maintenance-image {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 0 auto 40px;
            border-radius: 8px;
            display: block;
        }
        
        h1 {
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #000;
            letter-spacing: -0.5px;
        }
        
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .credit {
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="Maintenance" class="maintenance-image">
        <h1>We'll Be Back Soon</h1>
        <p>Fizzexual is currently busy doing… uh… important stuff. Basically, it’s on a coffee break, a nap, and maybe plotting world domination. Back soon!</p>
        <p class="credit">Fizzexuality &copy; 2026</p>
    </div>
</body>
</html>
